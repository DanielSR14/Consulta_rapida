<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" width="860" height="424" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" role="img" aria-label="Janela do Consulta Rapida: busca com 'pad' digitado e o resultado PADARIA PAO QUENTE LTDA, CNPJ 12.345.678/0001-90, Chapeco - SC.">
  <defs>
    <style>
      @keyframes cr-blink { 0%, 48% { opacity: 1 } 52%, 100% { opacity: 0 } }
      @keyframes cr-type  { 0%, 6% { width: 0 } 10% { width: 12px } 15% { width: 24px } 20%, 92% { width: 36px } 100% { width: 0 } }
      @keyframes cr-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
      @keyframes cr-in    { 0%, 16% { opacity: 0; transform: translateY(6px) } 26%, 100% { opacity: 1; transform: translateY(0) } }
      .cr-caret { animation: cr-blink 1.1s steps(1) infinite }
      .cr-win   { animation: cr-float 7s ease-in-out infinite }
      .cr-reveal{ animation: cr-type 6s steps(1) infinite }
      .cr-res   { animation: cr-in 6s ease-out infinite; transform-origin: center }
      @media (prefers-reduced-motion: reduce) {
        .cr-caret, .cr-win, .cr-reveal, .cr-res { animation: none }
      }
    </style>
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f1a3c" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="2"  stdDeviation="3"  flood-color="#141821" flood-opacity="0.10"/>
    </filter>
    <mask id="cr-type">
      <rect x="0" y="0" width="860" height="424" fill="#fff"/>
      <rect class="cr-reveal" x="206" y="118" width="0" height="28" fill="#000"/>
    </mask>
  </defs>

  <!-- dimmed screen behind -->
  <rect x="0" y="0" width="860" height="424" rx="18" fill="#0E1014"/>
  <g opacity="0.06" fill="#fff">
    <rect x="40"  y="44"  width="300" height="14" rx="7"/>
    <rect x="40"  y="74"  width="470" height="10" rx="5"/>
    <rect x="40"  y="96"  width="420" height="10" rx="5"/>
    <rect x="40"  y="330" width="360" height="10" rx="5"/>
    <rect x="40"  y="352" width="500" height="10" rx="5"/>
    <rect x="560" y="300" width="260" height="86" rx="10"/>
  </g>

  <!-- floating window -->
  <g class="cr-win">
    <rect x="150" y="52" width="560" height="320" rx="16" fill="#FFFFFF" filter="url(#cr-shadow)"/>

    <!-- header -->
    <rect x="178" y="76" width="30" height="30" rx="8" fill="#1F5AE8"/>
    <g stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round">
      <circle cx="191" cy="89" r="4.6"/>
      <line x1="194.5" y1="92.5" x2="199" y2="97"/>
    </g>
    <text x="220" y="97" font-size="16" font-weight="700" fill="#191C22">Consulta Rápida</text>

    <!-- search row -->
    <g stroke="#9AA3B2" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="187" cy="132" r="6"/>
      <line x1="191.5" y1="136.5" x2="197" y2="142"/>
    </g>
    <g mask="url(#cr-type)">
      <text x="208" y="140" font-size="18" fill="#191C22" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">pad</text>
    </g>
    <rect class="cr-caret" x="242" y="123" width="2" height="20" fill="#1F5AE8"/>

    <line x1="178" y1="160" x2="682" y2="160" stroke="#EEF0F3" stroke-width="1.5"/>

    <!-- selected result -->
    <g class="cr-res">
      <rect x="162" y="176" width="536" height="56" rx="10" fill="#ECF1FE"/>
      <text x="180" y="200" font-size="13.5" font-weight="700" fill="#191C22">PADARIA PÃO QUENTE LTDA</text>
      <text x="180" y="219" font-size="12" fill="#58616E" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">12.345.678/0001-90&#160;&#160;·&#160;&#160;Chapecó – SC</text>
      <rect x="616" y="192" width="66" height="24" rx="12" fill="#1F5AE8"/>
      <text x="649" y="208" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Copiar</text>
    </g>

    <!-- dim result -->
    <text x="180" y="260" font-size="13.5" font-weight="600" fill="#58616E">PADRÃO INDÚSTRIA DE MÓVEIS LTDA</text>
    <text x="180" y="279" font-size="12" fill="#8A94A2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">98.765.432/0001-11&#160;&#160;·&#160;&#160;Xanxerê – SC</text>

    <line x1="178" y1="304" x2="682" y2="304" stroke="#EEF0F3" stroke-width="1.5"/>

    <!-- footer -->
    <text x="180" y="336" font-size="11" fill="#8A94A2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.3">↑↓ navegar&#160;&#160;·&#160;&#160;⏎ selecionar&#160;&#160;·&#160;&#160;esc fechar</text>
  </g>
</svg>
